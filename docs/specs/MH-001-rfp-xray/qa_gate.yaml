regression_checks:
  - Edmonton and CER golden suites.
  - Source cleanup failure state transition.
  - Unsupported-claim and prompt-injection fixtures.
  - Submission-channel cases for permissive Portal, deadline-qualified Portal, conditional Portal rejection, unconditional fax rejection, and explicit channel prohibition.
  - Full local check, build, and browser gate before deployment.

review:
