  verdict: pending
  pending_review_task: QA2
  starts_after: T4 handoff exists and implementation checks are recorded
  previous_review:
    task: legacy_core_field_delta
    verdict: REQUEST_CHANGES
    source_verdict: REVISE
    revision_round: 3
    p0: 0
    p1: 2
    p2: 1
    disposition: redesign_or_human
    failed_acceptance: [AC-4, AC-5, AC-11]
  rule: Missing implementation handoff or evidence cannot produce PASS.

max_revision_rounds: 3
on_exhausted: redesign_or_human
