version: 1
chief_entrypoint: docs/agents/chief_agent.md
role_catalog: docs/agents/role_catalog.yaml
profile_context_bundles: docs/agent_context/profile_context_bundles.yaml
task_registry: docs/agent_tasks/registry.yaml
spec_template: docs/specs/template
knowledge_root: docs/agent_knowledge
default_max_implementers: 2
independent_review_required: true
max_revision_rounds: 3
full_history_by_default: false
knowledge_promotion_requires_review: true
reframing:
  enabled: true
  role: reframing
  repeated_fix_attempts: 2
  heuristic_debt:
    review_at: 3
    mandatory_at: 5
    block_local_heuristics_at: 8
  proposal_may_modify_product_code: false
  falsification_experiment_required: true
