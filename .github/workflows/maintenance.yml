name: Production maintenance

on:
  schedule:
    # Stagger away from the top of the hour, where GitHub warns scheduled jobs
    # are more likely to be delayed or dropped under load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: rfp-xray-production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: vars.RFP_XRAY_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Recover admissions and expire due runs
        env:
          MAINTENANCE_URL: ${{ vars.RFP_XRAY_MAINTENANCE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.RFP_XRAY_CRON_SECRET }}
        run: |
          test -n "$MAINTENANCE_URL"
          test -n "$MAINTENANCE_SECRET"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 50 --retry 1 --retry-all-errors \
            --header "Authorization: Bearer $MAINTENANCE_SECRET" \
            "$MAINTENANCE_URL"
