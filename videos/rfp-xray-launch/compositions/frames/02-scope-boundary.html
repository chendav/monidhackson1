  <div id="root" data-composition-id="f02-scope-boundary" data-width="1920" data-height="1080">
    <div id="f02-scope-boundary-ground" class="clip 02-scope-boundary-ground" data-start="0" data-duration="6" data-track-index="0">
      <div class="02-scope-boundary-grid">
        <section class="02-scope-boundary-anchor-zone">
          <p class="02-scope-boundary-eyebrow">Scope boundary</p>
          <h1 id="f02-scope-boundary-anchor" class="02-scope-boundary-anchor">RFP X-Ray<br>replaces</h1>
          <div id="f02-scope-boundary-rule" class="02-scope-boundary-rule"></div>
          <div class="02-scope-boundary-answer" aria-label="Supplied-document analysis">
            <div class="02-scope-boundary-answer-line">
              <span id="f02-scope-boundary-word-1" class="02-scope-boundary-word">SUPPLIED-</span>
              <span id="f02-scope-boundary-word-2" class="02-scope-boundary-word">DOCUMENT</span>
              <span id="f02-scope-boundary-word-3" class="02-scope-boundary-word">ANALYSIS</span>
            </div>
          </div>
        </section>

        <section class="02-scope-boundary-cycle-zone" aria-label="Excluded product categories">
          <div class="02-scope-boundary-boundary-line"></div>
          <div id="f02-scope-boundary-cycle-card" class="02-scope-boundary-cycle-card">
            <span id="f02-scope-boundary-cycle-text" class="02-scope-boundary-cycle-text">Search</span>

    </div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      const anchor = document.getElementById("f02-scope-boundary-anchor");
      const anchorRule = document.getElementById("f02-scope-boundary-rule");
      const cycleCard = document.getElementById("f02-scope-boundary-cycle-card");
      const cycleText = document.getElementById("f02-scope-boundary-cycle-text");
      const chrome = document.getElementById("f02-scope-boundary-chrome");

      tl.fromTo(
        anchor,
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        anchorRule,
        { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.38
      );
      tl.fromTo(
        cycleCard,
        { scale: 0, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.35
      );

      tl.set(cycleText, { innerText: "Search" }, 1.4);
      tl.set(cycleText, { innerText: "Bid writing" }, 2.1);
      tl.set(cycleText, { innerText: "CRM" }, 2.8);
      tl.set(cycleText, { innerText: "Approvals" }, 3.5);
      tl.to(cycleCard, { opacity: 0, duration: 0.18, ease: "power2.out" }, 4.02);

      const words = [
        { element: document.getElementById("f02-scope-boundary-word-1"), text: "SUPPLIED-" },
        { element: document.getElementById("f02-scope-boundary-word-2"), text: "DOCUMENT" },
        { element: document.getElementById("f02-scope-boundary-word-3"), text: "ANALYSIS" }
      ];
      let wordStart = 4.2;
      const wordTimeline = words.map((entry) => {
        const duration = 0.16 + entry.text.length * 0.012;
        const timed = { ...entry, start: wordStart, duration };
        wordStart += duration;
        return timed;
      });
      wordTimeline.forEach((entry) => {
        tl.fromTo(
          entry.element,
          { scale: 0, opacity: 0, y: 22 },
          { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          entry.start
        );
      });

      tl.fromTo(
        chrome,
        { scale: 0, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.2
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["f02-scope-boundary"] = tl;
    })();
  </script>
